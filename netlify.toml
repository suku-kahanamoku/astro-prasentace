[build]
command = "corepack pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Existing generated pages take precedence over these non-forced fallbacks.
[[redirects]]
from = "/en/*"
to = "/en/404/index.html"
status = 404

[[redirects]]
from = "/de/*"
to = "/de/404/index.html"
status = 404
